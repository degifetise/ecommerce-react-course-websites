<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Grid Cart</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin: 20px;
    }
    .product-card {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
      border-radius: 5px;
    }
    .product-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 5px;
    }
    .cart {
      margin: 20px;
      padding: 10px;
      border: 2px solid #333;
      border-radius: 5px;
    }
    .cart-item { margin: 5px 0; }
    .cart-item button {
      margin-left: 5px;
      padding: 2px 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Product Grid -->
  <div class="product-grid" id="product-grid"></div>

  <!-- Cart Section -->
  <div class="cart">
    <h2>Cart</h2>
    <div id="cart-items"></div>
    <p><strong>Total: $<span id="cart-total">0</span></strong></p>
  </div>

  <script>
    // Product list
    const products = [
      { id: 1, name: "Product A", price: 10, image: "https://via.placeholder.com/200x150" },
      { id: 2, name: "Product B", price: 15, image: "https://via.placeholder.com/200x150" },
      { id: 3, name: "Product C", price: 20, image: "https://via.placeholder.com/200x150" }
    ];

    let cart = [];

    // Render product cards
    function renderProducts() {
      const grid = document.getElementById("product-grid");
      products.forEach(product => {
        const card = document.createElement("div");
        card.classList.add("product-card");
        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}">
          <h3>${product.name}</h3>
          <p>$${product.price}</p>
          <button class="add-to-cart" data-id="${product.id}">Add to Cart</button>
        `;
        grid.appendChild(card);
      });

      // Attach event listeners
      document.querySelectorAll(".add-to-cart").forEach(button => {
        button.addEventListener("click", () => {
          const id = parseInt(button.getAttribute("data-id"));
          addToCart(id);
        });
      });
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const item = cart.find(p => p.id === id);

      if (item) {
        item.quantity += 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      displayCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      displayCart();
    }

    function decreaseQuantity(id) {
      const item = cart.find(p => p.id === id);
      if (item) {
        item.quantity -= 1;
        if (item.quantity <= 0) {
          removeFromCart(id);
        } else {
          displayCart();
        }
      }
    }

    function displayCart() {
      const cartItemsDiv = document.getElementById("cart-items");
      cartItemsDiv.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        total += item.price * item.quantity;
        cartItemsDiv.innerHTML += `
          <div class="cart-item">
            ${index+1}. ${item.name} - $${item.price} × ${item.quantity} = $${item.price * item.quantity}
            <button onclick="decreaseQuantity(${item.id})">-</button>
            <button onclick="removeFromCart(${item.id})">Remove</button>
          </div>
        `;
      });

      document.getElementById("cart-total").textContent = total;
    }

    // Initialize
    document.addEventListener("DOMContentLoaded", renderProducts);
console.log("hello from home");
  </script>

</body>
</html>
